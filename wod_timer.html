<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMRAP BOX - WOD Timer (Clock, Tabata, EMOM, AMRAP)</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16.png">
    <link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png">
    <meta name="theme-color" content="#000000">
    <link rel="preload" href="assets/fonts/iosevka-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/iosevka-semibold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/iosevka-bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-black">
    <div id="app" class="app-root">
        <!-- VISTA 1: MENU PRINCIPAL DE INICIO CON CUADROS -->
        <section id="view-home" class="view-section active">
            <div class="menu-container">
                <!-- LOGO/CABECERA DE MARCA PRINCIPAL AL INICIO -->
                <header class="home-brand-header">
                    <picture>
                        <source srcset="assets/amrapbox-banner.webp" type="image/webp">
                        <img src="assets/amrapbox-banner.png" alt="AMRAP BOX - Functional & CrossFit" class="home-brand-banner">
                    </picture>
                </header>

                <nav class="timer-nav">
                    <ul class="timer-menu-list">
                        <li>
                            <button class="timer-btn-menu" data-mode="clock" type="button">CLOCK</button>
                        </li>
                        <li>
                            <button class="timer-btn-menu" data-mode="tabata" type="button">TABATA</button>
                        </li>
                        <li>
                            <button class="timer-btn-menu" data-mode="fortime" type="button">FOR TIME</button>
                        </li>
                        <li>
                            <button class="timer-btn-menu" data-mode="emom" type="button">EMOM</button>
                        </li>
                        <li>
                            <button class="timer-btn-menu" data-mode="amrap" type="button">AMRAP</button>
                        </li>
                    </ul>
                </nav>
            </div>
            
            <!-- BADGE PRO CON TEXTURA DE FIBRA DE CARBONO EN ESQUINA -->
            <aside class="home-corner-badge" aria-label="AMRAP BOX Gym" title="AMRAP BOX Functional & CrossFit">
                <picture>
                    <source srcset="assets/logo-pro-square.webp" type="image/webp">
                    <img src="assets/logo-pro-square.jpeg" alt="AMRAP BOX Pro Logo" class="corner-badge-img">
                </picture>
                <div class="corner-badge-text">
                    <span class="corner-badge-title">AMRAP BOX</span>
                    <span class="corner-badge-sub">Functional &amp; CrossFit</span>
                </div>
            </aside>
        </section>

        <!-- VISTA 2: TIMER SELECCIONADO (CLOCK, TABATA, FOR TIME, EMOM, AMRAP) -->
        <section id="view-timer" class="view-section" style="display: none;">
            <!-- BARRA SUPERIOR DE NAVEGACION -->
            <header class="timer-topbar">
                <div class="topbar-left">
                    <button id="btn-back" class="timer-icon-btn" aria-label="Volver al menú" title="Volver al menú (Esc)">
                        <svg class="timer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 8 8 12 12 16"></polyline>
                            <line x1="16" y1="12" x2="8" y2="12"></line>
                        </svg>
                    </button>
                    <img src="assets/icon-64.png" class="topbar-brand-icon" alt="AMRAP BOX Icon" width="28" height="28">
                    <h2 id="timer-title" class="timer-header-title">CLOCK</h2>
                </div>
                <div class="topbar-right">
                    <button id="btn-mute" class="timer-icon-btn" aria-label="Silenciar / Activar sonido" title="Sonido">
                        <!-- Icono sonido activo -->
                        <svg class="timer-icon icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                        <!-- Icono silenciado -->
                        <svg class="timer-icon icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <line x1="23" y1="9" x2="17" y2="15"></line>
                            <line x1="17" y1="9" x2="23" y2="15"></line>
                        </svg>
                    </button>
                    <button id="btn-fullscreen" class="timer-icon-btn" aria-label="Pantalla completa" title="Pantalla completa (F)">
                        <svg class="timer-icon icon-fullscreen-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <polyline points="9 21 3 21 3 15"></polyline>
                            <line x1="21" y1="3" x2="14" y2="10"></line>
                            <line x1="3" y1="21" x2="10" y2="14"></line>
                        </svg>
                        <svg class="timer-icon icon-fullscreen-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <polyline points="4 14 10 14 10 20"></polyline>
                            <polyline points="20 10 14 10 14 4"></polyline>
                            <line x1="14" y1="10" x2="21" y2="3"></line>
                            <line x1="3" y1="21" x2="10" y2="14"></line>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- CUERPO PRINCIPAL -->
            <main class="timer-body">
                <!-- PANEL DE CONFIGURACIÓN PREVIA -->
                <div id="settings-view" class="timer-settings-wrapper" style="display: none;">
                    <div id="presets-container" class="timer-presets-container">
                        <!-- Chips inyectados dinámicamente -->
                    </div>

                    <form id="settings-form" class="timer-settings-form" onsubmit="return false;">
                        <!-- Campos para TABATA -->
                        <div id="fields-tabata" class="mode-fields" style="display: none;">
                            <div class="timer-setting-row">
                                <span class="label-left">work</span>
                                <div class="input-cell">
                                    <input type="number" id="input-tabata-work" class="timer-setting-input" value="20" min="5" max="300">
                                </div>
                                <span class="label-right">seconds</span>
                            </div>
                            <div class="timer-setting-row">
                                <span class="label-left">rest</span>
                                <div class="input-cell">
                                    <input type="number" id="input-tabata-rest" class="timer-setting-input" value="10" min="0" max="300">
                                </div>
                                <span class="label-right">seconds</span>
                            </div>
                            <div class="timer-setting-row">
                                <span class="label-left">for</span>
                                <div class="input-cell">
                                    <input type="number" id="input-tabata-rounds" class="timer-setting-input" value="8" min="1" max="99">
                                </div>
                                <span class="label-right">rounds</span>
                            </div>
                        </div>

                        <!-- Campos para FOR TIME -->
                        <div id="fields-fortime" class="mode-fields" style="display: none;">
                            <div class="timer-setting-row">
                                <span class="label-left">time cap</span>
                                <div class="input-cell">
                                    <input type="number" id="input-fortime-cap" class="timer-setting-input" value="10" min="0" max="180">
                                </div>
                                <span class="label-right">minutes</span>
                            </div>
                            <div class="timer-setting-caption">(0 = sin límite de tiempo)</div>
                        </div>

                        <!-- Campos para EMOM -->
                        <div id="fields-emom" class="mode-fields" style="display: none;">
                            <div class="timer-setting-row">
                                <span class="label-left">every</span>
                                <div class="input-cell">
                                    <input type="number" id="input-emom-interval" class="timer-setting-input" value="60" min="10" max="600" step="10">
                                </div>
                                <span class="label-right">seconds</span>
                            </div>
                            <div class="timer-setting-row">
                                <span class="label-left">for</span>
                                <div class="input-cell">
                                    <input type="number" id="input-emom-rounds" class="timer-setting-input" value="10" min="1" max="99">
                                </div>
                                <span class="label-right">rounds</span>
                            </div>
                        </div>

                        <!-- Campos para AMRAP -->
                        <div id="fields-amrap" class="mode-fields" style="display: none;">
                            <div class="timer-setting-row">
                                <span class="label-left">for</span>
                                <div class="input-cell">
                                    <input type="number" id="input-amrap-time" class="timer-setting-input" value="10" min="1" max="180">
                                </div>
                                <span class="label-right">minutes</span>
                            </div>
                        </div>

                        <button id="btn-start" class="timer-btn-start" type="button">START</button>
                    </form>
                </div>

                <!-- PANTALLA DEL RELOJ / CUENTA ATRÁS / ENTRENAMIENTO -->
                <div id="running-view" class="timer-display-wrapper">
                    <h3 id="timer-subheader" class="timer-subheader"></h3>
                    <time id="timer-clock" class="timer-clock" role="button" tabindex="0" title="Click o Espacio para Pausar / Reanudar">00:00</time>
                    <div id="timer-round-info" class="timer-round-info"></div>

                    <!-- BOTONERA DE CONTROL RÁPIDO -->
                    <div id="active-controls" class="timer-controls" style="display: none;">
                        <button id="btn-toggle-pause" class="timer-btn-control" type="button">PAUSE</button>
                        <button id="btn-reset" class="timer-btn-control" type="button">RESET</button>
                    </div>

                    <button id="btn-restart" class="timer-btn-start" type="button" style="display: none;">RESTART</button>
                </div>
            </main>
        </section>

        <!-- FOOTER DEDICATORIA GLOBAL (PRESENTE EN TODO LADO) -->
        <footer class="global-footer">
            <div class="footer-credit">
                <span class="footer-text">Made in Monterrey</span>
                <span class="flag-icon" aria-label="Colombia" title="Colombia">
                    <svg class="flag-co" viewBox="0 0 900 600" width="14" height="9.3" aria-hidden="true">
                        <rect width="900" height="600" fill="#FCD116" />
                        <rect width="900" height="300" y="300" fill="#003893" />
                        <rect width="900" height="150" y="450" fill="#CE1126" />
                    </svg>
                </span>
                <span class="footer-text">By <a href="https://cubillosxy.github.io/" target="_blank" rel="noopener noreferrer" class="footer-author-link">Edwin C.</a></span>
                <span class="footer-robot-icon" aria-label="Robot" title="Edwin C.">🤖</span>
            </div>
        </footer>
    </div>

    <!-- AUDIO ELEMENTS (SONIDOS DE CUENTA Y CAMBIO) -->
    <audio id="timer-short-beep" src="assets/short-beep.mp3" preload="auto"></audio>
    <audio id="timer-long-beep" src="assets/long-beep.mp3" preload="auto"></audio>

    <!-- 3D PARTICLE ENGINE (OFFLINE LOCAL BUNDLE) -->
    <script src="assets/three.min.js"></script>
    <script src="background_3d.js"></script>
    <script src="audio_manager.js"></script>
    <script src="script.js"></script>
</body>

</html>
